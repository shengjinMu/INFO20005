<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PETHAUS — Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav>
    <button id="menu-btn" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <a href="index.html">PETHAUS</a>
    <div class="nav-icons">
      <button aria-label="Search">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
      </button>
      <button aria-label="Cart">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </button>
      <button aria-label="Account">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="cart-page">
    <h1 class="section-title">Your Cart</h1>

    <div class="cart-layout">
      <div class="cart-items">
        <div class="cart-item">
          <img src="images/product4.png" alt="Tactical Harness Vest" />
          <div class="cart-item-info">
            <p class="cart-item-name">Tactical Harness Vest</p>
            <p class="cart-item-detail">Size: M</p>
            <p class="cart-item-price">$72.00</p>
          </div>
          <div class="quantity-selector">
            <button class="qty-btn">−</button>
            <span>1</span>
            <button class="qty-btn">+</button>
          </div>
          <button class="cart-remove">✕</button>
        </div>

        <div class="cart-item">
          <img src="images/product6.png" alt="Quilted Puffer Vest" />
          <div class="cart-item-info">
            <p class="cart-item-name">Quilted Puffer Vest</p>
            <p class="cart-item-detail">Size: L</p>
            <p class="cart-item-price">$75.00</p>
          </div>
          <div class="quantity-selector">
            <button class="qty-btn">−</button>
            <span>1</span>
            <button class="qty-btn">+</button>
          </div>
          <button class="cart-remove">✕</button>
        </div>
      </div>

      <div class="cart-summary">
        <p class="cart-total-label">Estimated Total</p>
        <p class="cart-total-amount">$147.00 AUD</p>
        <a href="checkout.html" class="btn-primary">CHECK OUT</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
