<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PETHAUS — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav>
    <button id="menu-btn" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <a href="index.html">PETHAUS</a>
    <div class="nav-icons">
      <button aria-label="Cart" onclick="window.location.href='cart.html'">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </button>
      <button aria-label="Account">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="checkout-page">
    <h1 class="section-title checkout-title">Payment Detail</h1>

    <div class="checkout-layout">
      <form class="checkout-form">
        <label>Name on card</label>
        <input type="text" placeholder="Cardholder Name" />

        <label>Card number</label>
        <input type="text" placeholder="1234 1234 1234 1234" />

        <div class="checkout-row">
          <div>
            <label>CVV</label>
            <input type="text" placeholder="123" />
          </div>
          <div>
            <label>Expiry</label>
            <input type="text" placeholder="DD/MM/YY" />
          </div>
        </div>

        <label>Billing Address</label>
        <input type="text" placeholder="Apt Number, Street Address" />

        <div class="checkout-row">
          <div>
            <label>State</label>
            <input type="text" placeholder="VIC" />
          </div>
          <div>
            <label>Postcode</label>
            <input type="text" placeholder="3000" />
          </div>
        </div>

        <label>Email</label>
        <input type="email" placeholder="example@email.com" />

        <button type="button" class="btn-primary" onclick="window.location.href='confirmation.html'">PAY NOW</button>
      </form>

      <div class="checkout-summary">
        <div class="checkout-item">
          <img src="images/product4.png" alt="Tactical Harness Vest" />
          <div>
            <p>Tactical Harness Vest (M)</p>
            <p>$72.00</p>
          </div>
        </div>
        <div class="checkout-item">
          <img src="images/product6.png" alt="Quilted Puffer Vest" />
          <div>
            <p>Quilted Puffer Vest (L)</p>
            <p>$75.00</p>
          </div>
        </div>
        <div class="checkout-total">
          <p>Total</p>
          <p>$147.00 AUD</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
